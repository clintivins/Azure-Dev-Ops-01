trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.8.5'
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)'
  azureServiceConnection: 'Azure-ARM-MainSub01'

stages:
  - stage: Validate
    displayName: Validate Terraform
    jobs:
      - job: Validate
        displayName: Format and validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Bash@3
            displayName: Install Terraform
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                mkdir -p "$HOME/bin"
                curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
                unzip -oq /tmp/terraform.zip -d "$HOME/bin"
                export PATH="$HOME/bin:$PATH"
                echo "##vso[task.prependpath]$HOME/bin"
                terraform version

          - task: AzureCLI@2
            displayName: Terraform format and validate
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |
                set -euo pipefail
                terraform fmt -check -recursive
                terraform init -input=false
                terraform validate

  - stage: Plan
    displayName: Plan Terraform
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Plan
        displayName: Create plan
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Bash@3
            displayName: Install Terraform
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                mkdir -p "$HOME/bin"
                curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
                unzip -oq /tmp/terraform.zip -d "$HOME/bin"
                export PATH="$HOME/bin:$PATH"
                echo "##vso[task.prependpath]$HOME/bin"
                terraform version

          - task: AzureCLI@2
            displayName: Create Terraform plan
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |
                set -euo pipefail
                terraform init -input=false
                terraform plan -input=false -var-file=terraform.tfvars.example -out=tfplan

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform plan
            inputs:
              targetPath: $(terraformWorkingDirectory)/tfplan
              artifact: terraform-plan

  - stage: Apply
    displayName: Apply Terraform
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: Apply
        displayName: Apply approved plan
        environment: alz-production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: terraform-plan

                - task: Bash@3
                  displayName: Install Terraform
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      mkdir -p "$HOME/bin"
                      curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
                      unzip -oq /tmp/terraform.zip -d "$HOME/bin"
                      export PATH="$HOME/bin:$PATH"
                      echo "##vso[task.prependpath]$HOME/bin"
                      terraform version

                - task: AzureCLI@2
                  displayName: Apply Terraform plan
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(terraformWorkingDirectory)
                    inlineScript: |
                      set -euo pipefail
                      terraform init -input=false
                      terraform apply -input=false "$(Pipeline.Workspace)/terraform-plan/tfplan"