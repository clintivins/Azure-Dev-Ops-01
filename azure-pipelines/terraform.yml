trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/*
      - azure-pipelines/*

pr: none

variables:
  terraformVersion: "1.15.6"
  workingDirectory: "terraform/environments/dev"
  serviceConnection: "Azure-ARM-MainSub01"
  backendResourceGroup: "rg-devops-clintivinsicloud"
  backendStorageAccount: "sttfdevcursororg01"
  backendContainer: "tfstate"
  backendKey: "dev.terraform.tfstate"

stages:
  - stage: Validate
    displayName: Validate Terraform
    jobs:
      - job: Validate
        displayName: Init and validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Terraform init and validate
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                curl -fsSL "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" -o /tmp/terraform.zip
                mkdir -p /tmp/tfbin
                unzip -o /tmp/terraform.zip -d /tmp/tfbin
                export PATH="/tmp/tfbin:$PATH"
                cd "$(workingDirectory)"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_CLIENT_SECRET="$servicePrincipalKey"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                terraform init -input=false \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=$(backendKey)"
                terraform validate

  - stage: Plan
    displayName: Plan Terraform
    dependsOn: Validate
    jobs:
      - job: Plan
        displayName: Terraform plan
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Terraform plan
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                curl -fsSL "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" -o /tmp/terraform.zip
                mkdir -p /tmp/tfbin
                unzip -o /tmp/terraform.zip -d /tmp/tfbin
                export PATH="/tmp/tfbin:$PATH"
                cd "$(workingDirectory)"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_CLIENT_SECRET="$servicePrincipalKey"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                terraform init -input=false \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=$(backendKey)"
                terraform plan -input=false -var-file=terraform.tfvars -out="$(Pipeline.Workspace)/tfplan"
                cp "$(Pipeline.Workspace)/tfplan" "$(Build.ArtifactStagingDirectory)/tfplan"

          - publish: $(Build.ArtifactStagingDirectory)/tfplan
            displayName: Publish plan artifact
            artifact: tfplan

  - stage: Apply
    displayName: Apply Terraform
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Apply
        displayName: Terraform apply
        environment: dev
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: tfplan

                - task: AzureCLI@2
                  displayName: Terraform apply
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      curl -fsSL "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" -o /tmp/terraform.zip
                      mkdir -p /tmp/tfbin
                      unzip -o /tmp/terraform.zip -d /tmp/tfbin
                      export PATH="/tmp/tfbin:$PATH"
                      cd "$(workingDirectory)"
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_CLIENT_SECRET="$servicePrincipalKey"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                      terraform init -input=false \
                        -backend-config="resource_group_name=$(backendResourceGroup)" \
                        -backend-config="storage_account_name=$(backendStorageAccount)" \
                        -backend-config="container_name=$(backendContainer)" \
                        -backend-config="key=$(backendKey)"
                      terraform apply -input=false "$(Pipeline.Workspace)/tfplan/tfplan"
